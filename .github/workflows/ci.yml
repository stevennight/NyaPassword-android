name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workspace mirrors the local layout: android/ and common/ (latest main;
# a release pins it with COMMON_REF instead) side by side.
jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out android
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: android
          persist-credentials: false

      - name: Check out common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/NyaPassword-common
          # read-only deploy key of the (private) common repository
          ssh-key: ${{ secrets.COMMON_DEPLOY_KEY }}
          path: common
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust and Android NDK
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          ndk="$(sed -n 's/^val ndkVersionPinned = "\(.*\)"$/\1/p' android/app/build.gradle.kts)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: android -> ../target

      - name: Install cargo-ndk
        run: cargo ndk --version || cargo install cargo-ndk --locked

      - name: Check version
        working-directory: android
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          grep -q "^version = \"$version\"" Cargo.toml || { echo "Cargo.toml version differs from VERSION $version" >&2; exit 1; }

      - name: Test the Rust core
        working-directory: android
        # Not --locked: common main may be ahead of this Cargo.lock (releases build with --locked).
        run: cargo test --workspace

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Lint, unit test and assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nyapassword-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
