name: Release

# Push a tag v<VERSION> (scripts/release.ps1 makes it) to build the signed APK
# and publish a GitHub release. Versions with a suffix (0.2.0-beta.1) are
# published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # The in-app updater checks this repository's releases.
      NPW_UPDATE_REPO: ${{ github.repository }}
    steps:
      - name: Check out android
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: android
          persist-credentials: false

      - name: Check tag matches VERSION
        id: version
        run: |
          version="$(tr -d '\r\n' < android/VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          ref="$(tr -d '\r\n' < android/COMMON_REF 2>/dev/null || echo main)"
          echo "common: $ref"
          echo "common=${ref}" >> "$GITHUB_OUTPUT"

      - name: Check out common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/NyaPassword-common
          ref: ${{ steps.version.outputs.common }}
          # read-only deploy key of the (private) common repository
          ssh-key: ${{ secrets.COMMON_DEPLOY_KEY }}
          path: common
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust and Android NDK
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          ndk="$(sed -n 's/^val ndkVersionPinned = "\(.*\)"$/\1/p' android/app/build.gradle.kts)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          cargo install cargo-ndk --locked

      - name: Test the Rust core
        working-directory: android
        run: cargo test --workspace --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Verify source
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest

      - name: Restore Android signing key
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing ${name} secret" >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/nya-password-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature and collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "Signed APK was not produced (is the keystore configured?)" >&2; exit 1; }
          "$apksigner" verify --print-certs "$apk"
          mkdir -p dist
          name="NyaPassword-Android_${VERSION}.apk"
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: NyaPassword Android ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: dist/*
